name: lilygo_erp_client
description: Offline-first Dolibarr order client with DuckDB-Wasm.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  http: ^1.2.2
  flutter_web3: ^2.1.9
  qr_flutter: ^4.1.0
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sample_products/
    - assets/hero/
